name: Astro verification

on:
  pull_request:
    paths:
      - "von-falk-mvp/**"
      - ".github/workflows/astro-verify.yml"
  push:
    branches: [main]
    paths:
      - "von-falk-mvp/**"
      - ".github/workflows/astro-verify.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: von-falk-mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The original Webflow export is retained only in a historical commit.
          fetch-depth: 0
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: von-falk-mvp/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Source constraints
        run: npm run verify:source
      - name: Lint
        run: npm run lint
      - name: Astro and TypeScript
        run: npm run typecheck
      - name: Static build
        run: npm run build
      - name: Check generated route count
        run: |
          test "$(find dist -type f -name index.html | wc -l)" -eq 14
      - name: Verify built routes, images, headings and internal links
        run: node scripts/site-qa.mjs dist
      - name: Restore historical Webflow reference
        run: |
          mkdir -p "$RUNNER_TEMP/vonfalk-original"
          git -C .. archive 1385bc25b16b8be15aa4c57297afea82969fdad9 | tar -x -C "$RUNNER_TEMP/vonfalk-original"
          test -s "$RUNNER_TEMP/vonfalk-original/index.html"
          test -s "$RUNNER_TEMP/vonfalk-original/template-8igy9jfp/licenses.html"
      - name: Download historical reference stylesheet
        run: |
          curl --fail --location --retry 3 --max-time 90 \
            "https://assets-global.website-files.com/65afab2b82c75aa35f79f8f2/css/von-falk.webflow.e19f53618.min.css" \
            --output "$RUNNER_TEMP/vonfalk-original.css"
          test "$(wc -c < "$RUNNER_TEMP/vonfalk-original.css")" -gt 10000
      - name: Upload historical reference CSS for visual audits
        uses: actions/upload-artifact@v4
        with:
          name: von-falk-original-css-reference
          path: ${{ runner.temp }}/vonfalk-original.css
          if-no-files-found: error
          retention-days: 7
      - name: Capture settled Webflow and Astro screenshots
        run: |
          npm run preview -- --host 127.0.0.1 --port 4321 > preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4321/ > /dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node scripts/interaction-smoke.mjs
          python3 -m http.server 4322 --directory "$RUNNER_TEMP/vonfalk-original" > reference.log 2>&1 &
          curl --retry 8 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:4322/index.html > /dev/null
          CHROME_PATH="$(command -v google-chrome || command -v chromium)" node scripts/capture-settled.mjs
          test "$(find visual-snapshots -maxdepth 1 -name '*.png' | wc -l)" -eq 116
          test -s visual-snapshots/capture-manifest.json
      - name: Quantify paired first-viewport screenshots
        run: node scripts/visual-diff.mjs visual-snapshots visual-audit
      - name: Upload visual difference report
        uses: actions/upload-artifact@v4
        with:
          name: von-falk-visual-audit
          path: von-falk-mvp/visual-audit/*
          if-no-files-found: error
          retention-days: 7
      - name: Upload navigation interaction captures
        uses: actions/upload-artifact@v4
        with:
          name: von-falk-navigation-open
          path: von-falk-mvp/interaction-snapshots/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload page snapshots
        uses: actions/upload-artifact@v4
        with:
          name: von-falk-browser-snapshots
          path: von-falk-mvp/visual-snapshots/*.png
          if-no-files-found: error
          retention-days: 7
